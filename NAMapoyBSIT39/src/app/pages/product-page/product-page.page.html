<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalog"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ product?.name }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="product">
  <div class="image-box ion-text-center">
    <img [src]="product.imageUrl" [alt]="product.name" />
  </div>

  <h2>₱ {{ product.price }}</h2>
  <p>{{ product.description }}</p>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button routerLink="/catalog">
          <ion-label>Catalog</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/home">
          <ion-label>Home</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/profile">
          <ion-label>Profile</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
