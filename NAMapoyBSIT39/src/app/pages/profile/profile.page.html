<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="avatar-container ion-margin-bottom">
    <ion-avatar style="width: 110px; height: 110px; margin: 0 auto;">
      <img [src]="profileData.avatarUrl" alt="Avatar" />
    </ion-avatar>
  </div>

  <ion-list lines="inset" class="ion-text-start">
    <ion-item>
      <ion-label>
        <p>Name</p>
        <h2>{{ profileData.name }}</h2>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <p>Username</p>
        <h2>{{ profileData.username }}</h2>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <p>Email</p>
        <h2>{{ profileData.email }}</h2>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <p>Address</p>
        <h2>{{ profileData.address }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button routerLink="/catalog">
          <ion-label>Catalog</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/home">
          <ion-label>Home</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/profile">
          <ion-label>Profile</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
