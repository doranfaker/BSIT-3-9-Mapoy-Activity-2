<ion-header>
  <ion-toolbar>
    <ion-title>Catalog</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let item of products">
        <ion-card class="ion-text-center">
          <img [src]="item.imageUrl" [alt]="item.name" />
          <ion-card-header>
            <ion-card-title>{{ item.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-button expand="block" size="small" [routerLink]="['/product-page', item.id]">
              View
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button routerLink="/catalog">
          <ion-label>Catalog</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/home">
          <ion-label>Home</ion-label>
        </ion-tab-button>
        <ion-tab-button routerLink="/profile">
          <ion-label>Profile</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
